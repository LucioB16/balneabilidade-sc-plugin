name: Build uploadable draft plugin ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build draft ZIP without inventing a video URL or countries
        run: python scripts/build_plugin_archive.py --mcp-url https://balneabilidade-sc.enzonic.dev/mcp --metadata submission/metadata.template.json --output dist/balneabilidade-sc-plugin-draft.zip
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: balneabilidade-sc-upload-draft
          path: dist/balneabilidade-sc-plugin-draft.zip
          if-no-files-found: error
