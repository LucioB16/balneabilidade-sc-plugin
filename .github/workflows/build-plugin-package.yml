name: Build plugin package for public review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plugin ZIP without inventing missing review metadata
        run: python scripts/build_plugin_archive.py --mcp-url https://balneabilidade-sc.enzonic.dev/mcp --metadata submission/metadata.template.json
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: balneabilidade-sc-package
          path: dist/balneabilidade-sc-plugin-*.zip
          if-no-files-found: error
