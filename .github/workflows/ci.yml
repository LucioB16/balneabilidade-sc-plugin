name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-and-remote-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned MCP server and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Validate plugin manifest and remote MCP handshake
        run: python -m pytest -q
      - name: Build container image
        run: docker build --tag balneabilidade-sc-plugin:ci .
